# Manual-only — enable PR triggers when budget permits.
# Each full eval is ~30-60 Claude judge calls per retriever × N_RUNS; running
# the full matrix on every PR is expensive (~$3-8 per run). Keep on
# workflow_dispatch until there's a clear policy for who pays.
#
# Status: SKETCH. Not yet runnable end-to-end without:
#   1. OPENAI_API_KEY + ANTHROPIC_API_KEY repo secrets
#   2. A way to make data/chroma_middle_earth/ (~65MB, gitignored) and
#      data/chunks_middle_earth.pkl available at job time. Options:
#      (a) restore from a release artifact uploaded after a manual rebuild,
#      (b) re-run app.rag.ingestion.build_index in the job (paid OpenAI embed,
#          ~25 min), (c) bake the index into a Docker image and use that here.
#      None of those are wired yet.

name: RAG eval (RAGAS)

on:
  workflow_dispatch:
    inputs:
      retriever:
        description: "Retriever kind (dense, sparse, hybrid, hyde, multi_query, pdr, semantic)"
        default: "dense"
        type: string
      n_runs:
        description: "Number of runs to average"
        default: "3"
        type: string
      k:
        description: "Top-k retrieved chunks"
        default: "4"
        type: string

jobs:
  ragas:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: "pip"
      - run: pip install -r requirements.txt

      # TODO: restore data/chroma_middle_earth/ and data/chunks_middle_earth.pkl
      # from a release artifact or rebuild from data/raw/. Currently absent.
      - name: Restore index (placeholder)
        run: |
          echo "::warning::Index restore not wired. Eval will fail until data/chroma_middle_earth/ exists."

      - name: Run RAGAS
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
        run: |
          python -m app.rag.eval.ragas_eval \
            --retriever "${{ inputs.retriever }}" \
            --k "${{ inputs.k }}" \
            --n-runs "${{ inputs.n_runs }}"

      - name: Compare to baseline
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
        run: |
          python -m app.rag.eval.compare_to_baseline \
            --baseline-retriever dense \
            --retriever "${{ inputs.retriever }}" \
            --k "${{ inputs.k }}"
        continue-on-error: true

      - name: Upload history + CSVs
        uses: actions/upload-artifact@v5
        if: always()
        with:
          name: ragas-${{ inputs.retriever }}-k${{ inputs.k }}
          path: |
            app/rag/eval/ragas_results/
            app/rag/eval/ragas_history/
